{% extends "base.html" %}{% from "_macros.html" import csrf %}
{% block title %}My account{% endblock %}
{% block content %}
<h2 class="mb-3">My account</h2>
<div class="row g-4">
  <div class="col-lg-6"><div class="card"><div class="card-header">Details</div><div class="card-body">
    <p class="small">Username: <strong>{{ me.username }}</strong> &middot; Role: <strong>{{ me.role }}</strong> &middot; Member since {{ me.created_at|date }}</p>
    <form method="post">{{ csrf() }}<input type="hidden" name="action" value="details">
      <div class="mb-3"><label class="form-label" for="full_name">Full name</label><input class="form-control" id="full_name" name="full_name" maxlength="100" required value="{{ me.full_name }}"></div>
      <div class="mb-3"><label class="form-label" for="email">Email (optional)</label><input class="form-control" id="email" type="email" name="email" maxlength="100" value="{{ me.email or '' }}"></div>
      <button class="btn btn-dark" type="submit">Save details</button></form></div></div></div>
  <div class="col-lg-6"><div class="card"><div class="card-header">Change password</div><div class="card-body">
    <form method="post">{{ csrf() }}<input type="hidden" name="action" value="password">
      <div class="mb-3"><label class="form-label" for="current_password">Current password</label><input class="form-control" id="current_password" type="password" name="current_password" required></div>
      <div class="mb-3"><label class="form-label" for="new_password">New password</label><input class="form-control" id="new_password" type="password" name="new_password" minlength="8" required></div>
      <div class="mb-3"><label class="form-label" for="confirm_password">Repeat new password</label><input class="form-control" id="confirm_password" type="password" name="confirm_password" minlength="8" required></div>
      <button class="btn btn-dark" type="submit">Change password</button></form></div></div></div>
</div>
{% endblock %}
